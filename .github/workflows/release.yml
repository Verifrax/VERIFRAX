name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build deterministic source archive
        run: |
          set -euo pipefail

          mkdir -p dist
          PREFIX="verifrax-${GITHUB_REF_NAME}/"

          git archive \
            --format=tar \
            --prefix="$PREFIX" \
            "$GITHUB_SHA" \
            | gzip -n >"dist/verifrax-${GITHUB_REF_NAME}-src.tar.gz"

          (
            cd dist
            sha256sum "verifrax-${GITHUB_REF_NAME}-src.tar.gz" \
              >"verifrax-${GITHUB_REF_NAME}-src.tar.gz.sha256"
          )

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
