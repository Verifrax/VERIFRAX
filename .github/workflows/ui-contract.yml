name: UI Contract - Non-Authority Constraints

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  enforce-ui-non-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Enforce read-only, fact-only runtime UI
        run: |
          set -euo pipefail
          python3 scripts/verify-ui-contract.py
