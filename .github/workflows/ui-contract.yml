name: UI Contract - Non-Authority Constraints

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  enforce-ui-non-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Enforce read-only, fact-only UI
        run: |
          set -euo pipefail

          FORBIDDEN_WORDS="recommend|should|why|guide|help|tutorial|how to|best practice|advice"

          set +e
          MATCHES="$(
            rg -n -i -S "(${FORBIDDEN_WORDS})" public docs .github \
              | awk '!/^public\/VERDICT_REFERENCE_v1\.md:/'
          )"
          STATUS="$?"
          set -e

          if [ "$STATUS" -gt 1 ]; then
            echo "UI contract scan failed to execute."
            exit "$STATUS"
          fi

          if [ -n "$MATCHES" ]; then
            echo "Forbidden authority language detected:"
            echo "$MATCHES"
            exit 1
          fi

          echo "UI contract satisfied."
