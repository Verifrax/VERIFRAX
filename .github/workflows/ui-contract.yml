name: UI Contract - Non-Authority Constraints

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  enforce-ui-non-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce read-only, fact-only runtime UI
        run: |
          set -euo pipefail
          python3 scripts/verify-ui-contract.py
