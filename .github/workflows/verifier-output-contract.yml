name: Verifier Output Contract - Binary Only

on:
  push:
  pull_request:

env:
  LC_ALL: C
  TZ: UTC

permissions:
  contents: read

jobs:
  enforce-binary-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "20"
          cache: pnpm

      - name: Activate package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve golden bundle
        id: bundle
        run: |
          set -euo pipefail

          BUNDLE_PATH=""

          if [ -d public/conformance/golden/delivery_v1/input ]; then
            BUNDLE_PATH="public/conformance/golden/delivery_v1/input"
          elif [ -d tests/bundles/valid ]; then
            BUNDLE_PATH="$(
              find tests/bundles/valid \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                -print \
                -quit
            )"
          fi

          if [ -z "$BUNDLE_PATH" ]; then
            echo "No golden bundle found."
            exit 1
          fi

          echo "bundle_path=$BUNDLE_PATH" >>"$GITHUB_OUTPUT"

      - name: Build verifier
        run: pnpm build:strict

      - name: Run verifier
        run: |
          set -euo pipefail

          node scripts/delivery_v1_runner.mjs \
            --in "${{ steps.bundle.outputs.bundle_path }}" \
            --out /tmp/verifier-output \
            --profile delivery_v1@1.0.0

          cp /tmp/verifier-output/verdict.json verdict.json

      - name: Assert output contract
        run: |
          set -euo pipefail

          test -f verdict.json

          KEYS="$(jq -r 'keys | sort | join(",")' verdict.json)"

          if [ "$KEYS" != "bundle_hash,verdict_id" ]; then
            echo "Unexpected verifier keys: $KEYS"
            cat verdict.json
            exit 1
          fi

          VERDICT_ID="$(jq -r '.verdict_id' verdict.json)"
          BUNDLE_HASH="$(jq -r '.bundle_hash' verdict.json)"

          if [[ ! "$VERDICT_ID" =~ ^VFXV1:sha256:[a-f0-9]{64}:sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid verdict_id: $VERDICT_ID"
            exit 1
          fi

          if [[ ! "$BUNDLE_HASH" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid bundle_hash: $BUNDLE_HASH"
            exit 1
          fi

          echo "Verifier output contract satisfied."
