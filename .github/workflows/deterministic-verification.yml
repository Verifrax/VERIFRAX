name: Deterministic Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24.15.0"

      - name: Run protocol conformance suite
        run: |
          set -euo pipefail
          node protocol-conformance/runner/run_conformance.mjs

      - name: Run Rust verifier
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo run \
            --manifest-path verifier/rust/Cargo.toml \
            --bin verifrax-rust-verifier
