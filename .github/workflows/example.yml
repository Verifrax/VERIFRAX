name: CICULLIS

on:
  pull_request:

permissions: {}

env:
  LC_ALL: C
  TZ: UTC

jobs:
  cicullis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Run CICULLIS
        uses: midiakiasat/cicullis@dab3de0e68ef9de41dc733d6fa694512ef4b7716
        with:
          profile: profiles/default.profile
