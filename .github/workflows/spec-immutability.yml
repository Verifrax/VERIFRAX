name: Spec immutability

on:
  pull_request:
    paths:
      - "public/spec/**"
  push:
    branches: [main]
    paths:
      - "public/spec/**"

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Block edits to frozen spec versions
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          git fetch origin "${{ github.base_ref }}" --depth=1
          BASE="origin/${{ github.base_ref }}"

          mapfile -t CHANGED < <(
            git diff --name-only "$BASE"...HEAD -- public/spec/
          )

          mapfile -t EXISTING < <(
            git ls-tree -d --name-only "$BASE" "public/spec/*" \
              | sed 's#^public/spec/##'
          )

          for version in "${EXISTING[@]}"; do
            for file in "${CHANGED[@]}"; do
              case "$file" in
                "public/spec/$version/"*)
                  echo "Frozen spec version modified: public/spec/$version/"
                  exit 1
                  ;;
              esac
            done
          done

          echo "Existing spec versions are immutable."

      - name: Verify manifests
        run: |
          set -euo pipefail

          for directory in public/spec/*; do
            if [ ! -d "$directory" ]; then
              continue
            fi

            test -f "$directory/MANIFEST.sha256"
            test -f "$directory/FREEZE.txt"
            test -f "$directory/SOURCE.txt"

            (
              cd "$directory"
              TEMP_MANIFEST="$(mktemp)"

              find . \
                -type f \
                ! -name MANIFEST.sha256 \
                ! -name MANIFEST_SHA256.txt \
                -print0 \
                | LC_ALL=C sort -z \
                | xargs -0 sha256sum \
                | sed 's/  \.\//  /' \
                >"$TEMP_MANIFEST"

              diff -u MANIFEST.sha256 "$TEMP_MANIFEST"
            )
          done
