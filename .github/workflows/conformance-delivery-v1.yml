name: Conformance - Delivery v1 Determinism Gate

on:
  push:
  pull_request:

env:
  LC_ALL: C
  TZ: UTC

jobs:
  conformance-delivery-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24.15.0"
      - name: Activate package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build verifier
        run: pnpm build:strict

      - name: Run delivery CLI on golden bundle
        run: |
          set -euo pipefail

          node scripts/delivery_v1_runner.mjs \
            --in public/conformance/golden/delivery_v1/input \
            --out /tmp/delivery-output \
            --profile delivery_v1@1.0.0

      - name: Verify deterministic output
        run: |
          set -euo pipefail

          OUTPUT="/tmp/delivery-output/verdict.json"
          EXPECTED="public/conformance/golden/delivery_v1/expected/bundle_hash.txt"

          test -f "$OUTPUT"
          test -f "$EXPECTED"

          BUNDLE_HASH="$(jq -r '.bundle_hash' "$OUTPUT")"
          EXPECTED_HASH="$(tr -d '\n' < "$EXPECTED")"

          if [ -z "$BUNDLE_HASH" ] || [ "$BUNDLE_HASH" = "null" ]; then
            echo "bundle_hash missing from verdict."
            exit 1
          fi

          if [ "$BUNDLE_HASH" != "$EXPECTED_HASH" ]; then
            echo "Bundle hash mismatch."
            echo "Expected: $EXPECTED_HASH"
            echo "Actual:   $BUNDLE_HASH"
            exit 1
          fi

          VERDICT_ID="$(jq -r '.verdict_id' "$OUTPUT")"

          if [[ ! "$VERDICT_ID" =~ ^VFXV1:sha256:[a-f0-9]{64}:sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid verdict_id: $VERDICT_ID"
            exit 1
          fi

          KEYS="$(jq -r 'keys | sort | join(",")' "$OUTPUT")"

          if [ "$KEYS" != "bundle_hash,verdict_id" ]; then
            echo "Unexpected verdict keys: $KEYS"
            exit 1
          fi

          echo "Delivery v1 output is deterministic and binary-only."
