name: Freeze Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "verifrax-freeze/**"
      - "docs/operations/BUILD_HASH.txt"
      - "docs/operations/BUILD_REPRODUCE.sh"
      - ".github/workflows/freeze-integrity.yml"
      - "docs/spec/CERTIFICATE_SCHEMA.json"
      - ".certificate_schema_checksum"

env:
  LC_ALL: C
  TZ: UTC

jobs:
  block-freeze-modification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Block modifications to frozen artifacts
        run: |
          set -euo pipefail

          mapfile -t CHANGES < <(
            git diff --name-status \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              -- verifrax-freeze/
          )

          FORBIDDEN=()

          for change in "${CHANGES[@]}"; do
            status="${change%%$'\t'*}"
            file="${change#*$'\t'}"

            if [ "$status" = "M" ] &&
               [ "$file" != "verifrax-freeze/v2.8.0/source/VERIFRAX" ]; then
              FORBIDDEN+=("$change")
            fi
          done

          if [ "${#FORBIDDEN[@]}" -gt 0 ]; then
            echo "Forbidden modifications to frozen artifacts:"
            printf '  %s\n' "${FORBIDDEN[@]}"
            exit 1
          fi

          echo "Frozen artifact modifications verified."

  offline-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24.15.0"

      - name: Verify offline CLI behaviour
        run: |
          set -euo pipefail

          cd archive/verifrax-reference-verifier
          node cli.js --help >/tmp/verifrax-help.txt
          test -s /tmp/verifrax-help.txt

          printf '%s\n' '{"invalid":true}' >/tmp/verifrax-invalid-certificate.json

          set +e
          node cli.js /tmp/verifrax-invalid-certificate.json \
            >/tmp/verifrax-invalid.stdout \
            2>/tmp/verifrax-invalid.stderr
          STATUS="$?"
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "Invalid certificate was accepted."
            exit 1
          fi

          echo "Offline verifier rejects invalid certificates."

  build-hash-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify BUILD_HASH.txt without mutating checkout
        run: |
          set -euo pipefail

          test -s docs/operations/BUILD_HASH.txt
          test -s docs/operations/BUILD_REPRODUCE.sh

          RECORDED="$(tr -d '\n' < docs/operations/BUILD_HASH.txt)"
          TEMP_ROOT="$(mktemp -d)"

          git archive HEAD | tar -x -C "$TEMP_ROOT"

          (
            cd "$TEMP_ROOT"
            bash docs/operations/BUILD_REPRODUCE.sh >/tmp/verifrax-build-reproduce.log
          )

          CURRENT="$(tr -d '\n' < "$TEMP_ROOT/BUILD_HASH.txt")"

          if [ "$RECORDED" != "$CURRENT" ]; then
            echo "Build hash mismatch."
            echo "Recorded: $RECORDED"
            echo "Current:  $CURRENT"
            exit 1
          fi

          git diff --exit-code
          echo "Build hash verified."

  certificate-schema-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify certificate schema checksum
        run: |
          set -euo pipefail

          EXPECTED="$(awk '{print $1}' .certificate_schema_checksum)"
          ACTUAL="$(sha256sum docs/spec/CERTIFICATE_SCHEMA.json | cut -d' ' -f1)"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "CERTIFICATE_SCHEMA.json checksum mismatch."
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "Certificate schema checksum verified."
