name: Verifrax Finality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  LC_ALL: C
  TZ: UTC

jobs:
  finality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24.15.0"
      - name: Activate package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify finality surfaces
        run: |
          set -euo pipefail

          test -s docs/operations/BUILD_HASH.txt
          test -s docs/operations/BUILD_REPRODUCE.sh
          test -s protocol-conformance/runner/run_conformance.mjs
          test -s scripts/verify-truth-index.mjs

          node protocol-conformance/runner/run_conformance.mjs
          node scripts/verify-truth-index.mjs
          pnpm build:strict
          pnpm test

      - name: Verify reproducible build hash outside checkout
        run: |
          set -euo pipefail

          RECORDED="$(tr -d '\n' < docs/operations/BUILD_HASH.txt)"
          TEMP_ROOT="$(mktemp -d)"

          git archive HEAD | tar -x -C "$TEMP_ROOT"

          (
            cd "$TEMP_ROOT"
            bash docs/operations/BUILD_REPRODUCE.sh >/tmp/verifrax-finality-build.log
          )

          CURRENT="$(tr -d '\n' < "$TEMP_ROOT/BUILD_HASH.txt")"

          if [ "$RECORDED" != "$CURRENT" ]; then
            echo "Finality build hash mismatch."
            echo "Recorded: $RECORDED"
            echo "Current:  $CURRENT"
            exit 1
          fi

          git diff --exit-code
