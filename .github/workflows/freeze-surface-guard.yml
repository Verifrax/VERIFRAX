name: Freeze Surface Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  freeze-surface-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Enforce canonical freeze surface
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="freeze/FREEZE_SURFACE_MANIFEST.json"
          test -f "$MANIFEST"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
            HEAD_SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          mapfile -t ALLOWED < <(
            jq -r '.hash_bound_files[]?, .hash_files[]?' "$MANIFEST" \
              | sort -u
          )
          ALLOWED+=("$MANIFEST")

          mapfile -t ALL_CHANGED < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA"
          )

          CHANGED=()

          for file in "${ALL_CHANGED[@]}"; do
            case "$file" in
              freeze/*)
                CHANGED+=("$file")
                ;;
            esac
          done

          BAD=()

          for file in "${CHANGED[@]}"; do
            FOUND=0

            for allowed in "${ALLOWED[@]}"; do
              if [ "$file" = "$allowed" ]; then
                FOUND=1
                break
              fi
            done

            if [ "$FOUND" -ne 1 ]; then
              BAD+=("$file")
            fi
          done

          if [ "${#BAD[@]}" -gt 0 ]; then
            echo "Non-canonical modifications under freeze/:"
            printf '  - %s\n' "${BAD[@]}"
            exit 1
          fi

          MISSING=()

          for allowed in "${ALLOWED[@]}"; do
            if [ ! -f "$allowed" ]; then
              MISSING+=("$allowed")
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "Freeze manifest lists missing files:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi

          echo "Canonical freeze surface enforced."
