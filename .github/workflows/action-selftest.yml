name: action-selftest

on:
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run surface-only action
        uses: ./
        with:
          surface_path: fixtures/surfaces/evaluation.surface.json
          policy_path: policy/example.v1.json
          mode: audit
          out_path: surface-only.seal.json

      - name: Run artifact-ingestion action
        uses: ./
        with:
          sbom_path: fixtures/sbom/minimal.cdx.json
          policy_path: policy/example.v1.json
          mode: audit
          out_path: artifact.seal.json

      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s surface-only.seal.json
          test -s artifact.seal.json
          jq -e '.surface.artifact_hash and .seal and .decision' surface-only.seal.json
          jq -e '.surface.artifact_hash and .seal and .decision' artifact.seal.json
          head -c 200 surface-only.seal.json
