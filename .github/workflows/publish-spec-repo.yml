name: publish-spec-repo

on:
  push:
    branches: [main]
    paths:
      - "public/spec/**"
      - ".github/workflows/publish-spec-repo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Export spec
        run: |
          set -euo pipefail
          bash scripts/spec-export.sh /tmp/spec-export

      - name: Publish through protected-repository pull request
        env:
          PAT: ${{ secrets.VERIFRAX_SYSTEMS_PUSH_TOKEN }}
          GH_TOKEN: ${{ secrets.VERIFRAX_SYSTEMS_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          TARGET_REPO="Verifrax/VERIFRAX-SPEC"
          BRANCH="autopublish-${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          EXPORT="/tmp/spec-export"

          test -d "$EXPORT"
          test ! -L "$EXPORT"

          test -d "$EXPORT/latest"
          test ! -L "$EXPORT/latest"

          mapfile -t EXPORT_ROOTS < <(
            find "$EXPORT" \
              -mindepth 1 \
              -maxdepth 1 \
              -printf '%f\n' |
            sort
          )

          VERSION_COUNT=0

          for ROOT in "${EXPORT_ROOTS[@]}"; do
            case "$ROOT" in
              README.md)
                ;;
              latest)
                ;;
              v[0-9]*.[0-9]*.[0-9]*)
                if [[ ! "$ROOT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "Unsupported exported version root: $ROOT" >&2
                  exit 1
                fi

                VERSION_COUNT=$((VERSION_COUNT + 1))
                ;;
              *)
                echo "Unsupported spec export root: $ROOT" >&2
                exit 1
                ;;
            esac
          done

          test "$VERSION_COUNT" -ge 1

          rm -rf spec-repo

          git clone \
            "https://github.com/${TARGET_REPO}.git" \
            spec-repo

          cd spec-repo

          git fetch origin main
          git switch -c "$BRANCH" origin/main

          PRESERVED_PATHS=(
            ".github/.governance-push"
            ".github/CODEOWNERS"
            ".github/workflows/ci.yml"
            ".github/workflows/determinism-check.yml"
            ".github/workflows/identity.yml"
            ".github/workflows/spec-guards.yml"
            ".github/workflows/verify-spec.yml"
            ".gitignore"
            ".verifrax/spec.manifest.json"
            ".verifrax/tags/v2.8.0.txt"
            "CITATION.cff"
            "CONTRIBUTING.md"
            "GOVERNANCE.md"
            "LICENSE"
            "SECURITY.md"
            "package.json"
            "spec/VERSION"
          )

          for PATH_TO_PRESERVE in "${PRESERVED_PATHS[@]}"; do
            test -e "$PATH_TO_PRESERVE"
          done

          # `latest/` is the only existing publication root that may change.
          # Its contents are source-derived and replaceable as a unit.
          if [[ -e latest && ! -d latest ]]; then
            echo "Target latest path is not a directory." >&2
            exit 1
          fi

          if [[ -L latest ]]; then
            echo "Target latest path must not be a symlink." >&2
            exit 1
          fi

          rm -rf -- latest
          cp -R "$EXPORT/latest" ./latest

          NEW_VERSION_ROOTS=()

          for SRC in "$EXPORT"/v*; do
            test -e "$SRC" || continue

            NAME="${SRC##*/}"

            if [[ ! "$NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported exported version directory: $NAME" >&2
              exit 1
            fi

            test -d "$SRC"
            test ! -L "$SRC"

            if [[ -e "$NAME" ]]; then
              test -d "$NAME"
              test ! -L "$NAME"

              if ! diff -qr -- "$SRC" "$NAME" > /tmp/spec-version-diff.txt; then
                echo "Immutable published version differs: $NAME" >&2
                cat /tmp/spec-version-diff.txt >&2
                exit 1
              fi
            else
              cp -R "$SRC" "$NAME"
              NEW_VERSION_ROOTS+=("$NAME")
            fi
          done

          git add -A -- latest

          if [[ "${#NEW_VERSION_ROOTS[@]}" -gt 0 ]]; then
            git add -A -- "${NEW_VERSION_ROOTS[@]}"
          fi

          # Publication ownership is a positive allowlist.
          # Nothing outside latest/** or a newly-added immutable version
          # directory may appear in the candidate.
          git diff \
            --cached \
            --name-status \
            > /tmp/spec-publication-status.txt

          while IFS=$'\t' read -r STATUS PATHNAME EXTRA; do
            [[ -n "$STATUS" ]] || continue

            if [[ -n "${EXTRA:-}" ]]; then
              echo "Rename/copy status is forbidden: $STATUS $PATHNAME $EXTRA" >&2
              exit 1
            fi

            case "$PATHNAME" in
              latest/*)
                ;;
              v*/*)
                ROOT="${PATHNAME%%/*}"
                ALLOWED_NEW=false

                for NEW_ROOT in "${NEW_VERSION_ROOTS[@]}"; do
                  if [[ "$ROOT" == "$NEW_ROOT" ]]; then
                    ALLOWED_NEW=true
                    break
                  fi
                done

                if [[ "$ALLOWED_NEW" != "true" ]]; then
                  echo "Existing immutable version modification forbidden: $PATHNAME" >&2
                  exit 1
                fi

                case "$STATUS" in
                  A|A*)
                    ;;
                  *)
                    echo "New version path must be additive only: $STATUS $PATHNAME" >&2
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "Publication candidate escaped managed scope: $PATHNAME" >&2
                exit 1
                ;;
            esac
          done < /tmp/spec-publication-status.txt

          # Governance/perimeter content is never publication-owned.
          if ! git diff --quiet -- "${PRESERVED_PATHS[@]}"; then
            echo "Publication modified protected working-tree content." >&2
            exit 1
          fi

          if ! git diff --cached --quiet -- "${PRESERVED_PATHS[@]}"; then
            echo "Publication staged protected governance content." >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No managed spec publication changes."
          else
            # Credentials are required only when a real managed publication
            # delta exists. Read/no-op publication never depends on the PAT.
            test -n "$PAT"
            test -n "$GH_TOKEN"

          git config --global user.name "verifrax-systems"
          git config --global user.email "verifrax-systems@users.noreply.github.com"

          git commit \
            -m "publish: spec from ${GITHUB_SHA}"

          git remote set-url \
            origin \
            "https://x-access-token:${PAT}@github.com/${TARGET_REPO}.git"

          git push \
            -u \
            origin \
            "$BRANCH"

            gh pr create \
              --repo "$TARGET_REPO" \
              --title "publish: ${GITHUB_SHA::7}" \
              --body "Automated publication from Verifrax/VERIFRAX@${GITHUB_SHA}" \
              --head "$BRANCH" \
              --base main
          fi
