name: Finality Guard - Prevent Authority Re-Entry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LC_ALL: C
  TZ: UTC

jobs:
  block-authority-re-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Block frozen semantic changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          mapfile -t CHANGED_FILES < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA"
          )

          FROZEN_FILES=()

          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              core/axioms/*|core/contracts/*|core/schemas/*|public/VERDICT_REFERENCE_v1.md)
                FROZEN_FILES+=("$file")
                ;;
            esac
          done

          if [ "${#FROZEN_FILES[@]}" -gt 0 ]; then
            printf '%s\n' "FROZEN FILES MODIFIED:"
            printf '  - %s\n' "${FROZEN_FILES[@]}"
            printf '%s\n' "Semantic changes require a new major protocol version."
            exit 1
          fi

          echo "No frozen authority files were modified."
