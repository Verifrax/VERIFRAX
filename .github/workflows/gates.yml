name: Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cicullis:
    name: cicullis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Policy gate
        run: |
          set -euo pipefail
          ./gate.sh --profile profiles/default.profile

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24.15.0"
      - name: Activate package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Repository hygiene
        run: |
          set -euo pipefail
          node scripts/repo-hygiene.mjs
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0)

  selftest:
    name: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24.15.0"
      - name: Activate package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: |
          set -euo pipefail
          pnpm build:strict
          pnpm test
          node protocol-conformance/runner/run_conformance.mjs
          node scripts/verify-truth-index.mjs
