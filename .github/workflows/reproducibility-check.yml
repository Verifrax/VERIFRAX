name: Verifier Reproducibility Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "20"

      - name: Verify deterministic reference output
        run: |
          set -euo pipefail
          node ci/verify-reproducibility.mjs
