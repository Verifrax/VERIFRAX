name: release-tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, such as v1.0.2
        required: true
        type: string
      title:
        description: Release title
        required: true
        type: string
      notes:
        description: Release notes
        required: true
        type: string
      target:
        description: Existing commit or ref to tag
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Create immutable annotated tag
        env:
          TAG: ${{ inputs.tag }}
          TARGET_INPUT: ${{ inputs.target }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

          TARGET="${TARGET_INPUT:-HEAD}"
          git rev-parse --verify "$TARGET^{commit}" >/dev/null

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag already exists and will not be moved: $TAG"
            exit 1
          fi

          git config user.name "verifrax-release-bot"
          git config user.email "verifrax-release-bot@users.noreply.github.com"

          git tag -a "$TAG" "$TARGET" -m "$RELEASE_TITLE"
          git push origin "refs/tags/$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES"
